name: 💡 Feature Request
description: Suggest an idea or enhancement for RĀY (UI, sensors, ML, piezo synth)
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share your ideas for new scents, hardware upgrades, or animation effects!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What feature would you like to see added?
    validations:
      required: true
  - type: textarea
    id: problem-or-usecase
    attributes:
      label: Problem or Use Case
      description: What problem does this solve or what experience does it create?
    validations:
      required: false
