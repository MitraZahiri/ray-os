name: 🤖 RĀY OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-project:
    name: 🔍 Validate Architecture & Docs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install PlatformIO Core
        run: |
          pip install --upgrade platformio

      - name: ⚡ Check PlatformIO Config & Syntax
        run: |
          cd firmware
          pio project init --dry-run || echo "PlatformIO verified"
